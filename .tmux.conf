set -g default-terminal "${TERM}"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind \\ split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

set -s set-clipboard on
set -g allow-passthrough on

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=#e78a4e bold'

# Pane styling (gruvbox material dark)
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#7daea3'

# Transparent status bar (gruvbox material dark)
set -g status-style 'bg=default,fg=#d4be98'
set -g status-left '#[fg=#89b482,bold] #S '
set -g status-right '#[fg=#7c6f64]%H:%M %Z'
set -g window-status-format '#[fg=#7c6f64] #I:#W'
set -g window-status-current-format '#[fg=#d8a657,bold] #I:#W'
set -g message-style 'bg=#3c3836,fg=#d4be98'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
